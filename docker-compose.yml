services:
  postgres:
    image: postgres:16-alpine
    container_name: taskmesh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-taskmesh}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-taskmesh}"]
      interval: 5s
      timeout: 5s
      retries: 5
    stop_grace_period: 10s

  redis:
    image: redis:7-alpine
    container_name: taskmesh-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    stop_grace_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskmesh-api
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/taskmesh}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - API_PORT=${API_PORT:-8000}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    stop_grace_period: 15s

  dispatcher:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskmesh-dispatcher
    restart: unless-stopped
    command: ["python", "-m", "app.workers.dispatcher"]
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/taskmesh}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DISPATCHER_POLL_INTERVAL_SECONDS=${DISPATCHER_POLL_INTERVAL_SECONDS:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    stop_grace_period: 15s

  worker-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskmesh-worker-1
    restart: unless-stopped
    command: ["python", "-m", "app.workers.runner"]
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/taskmesh}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-4}
      - DEFAULT_JOB_LEASE_TIMEOUT_SECONDS=${DEFAULT_JOB_LEASE_TIMEOUT_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    stop_grace_period: 20s

  worker-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskmesh-worker-2
    restart: unless-stopped
    command: ["python", "-m", "app.workers.runner"]
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/taskmesh}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-4}
      - DEFAULT_JOB_LEASE_TIMEOUT_SECONDS=${DEFAULT_JOB_LEASE_TIMEOUT_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    stop_grace_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskmesh-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stop_grace_period: 10s

volumes:
  postgres_data:
  redis_data:
